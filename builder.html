<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBERPUMP - Workout Web Builder</title>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --fluo-cyan: #00f0ff;
      --fluo-magenta: #ff007f;
      --fluo-lime: #00ff88;
      --fluo-orange: #ff9900;
      --bg-dark: #050811;
      --card-bg: rgba(13, 19, 33, 0.85);
      --input-bg: rgba(5, 10, 20, 0.9);
      --text-main: #ffffff;
      --text-muted: #8a99ad;
      --font-cyber: 'Orbitron', monospace, sans-serif;
      --font-body: 'Chakra Petch', -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-body);
      padding: 30px 20px 50px;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.08) 0%, transparent 60%),
        linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0, 240, 255, 0.02) 100%);
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
    }

    /* TOP BAR / BACK TO HUB LINK */
    .top-bar {
      display: flex;
      justify-content: flex-start;
      margin-bottom: 20px;
    }

    .back-link {
      color: var(--fluo-cyan);
      text-decoration: none;
      font-family: var(--font-cyber);
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 1px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.25s ease;
      background: rgba(0, 240, 255, 0.05);
      border: 1px solid rgba(0, 240, 255, 0.3);
      padding: 8px 16px;
      border-radius: 8px;
    }

    .back-link:hover {
      background: rgba(0, 240, 255, 0.15);
      border-color: var(--fluo-cyan);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      transform: translateX(-3px);
    }

    .header {
      text-align: center;
      margin-bottom: 35px;
    }

    .header h1 {
      font-family: var(--font-cyber);
      color: var(--fluo-cyan);
      font-size: 38px;
      text-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
      margin-bottom: 8px;
      letter-spacing: 3px;
      font-weight: 800;
    }

    .header p {
      color: var(--text-muted);
      font-size: 15px;
      letter-spacing: 0.5px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(0, 240, 255, 0.03);
    }

    .form-group {
      margin-bottom: 22px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      font-family: var(--font-cyber);
    }

    /* CYBER INPUTS & SELECTS */
    .form-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid rgba(0, 240, 255, 0.3);
      color: var(--fluo-cyan);
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 700;
      font-family: var(--font-cyber);
      letter-spacing: 0.5px;
      transition: all 0.25s ease;
      text-shadow: 0 0 5px rgba(0, 240, 255, 0.3);
    }

    .form-input::placeholder {
      color: rgba(138, 153, 173, 0.4);
      font-weight: 400;
      text-shadow: none;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--fluo-cyan);
      box-shadow: 0 0 18px rgba(0, 240, 255, 0.4);
      background: rgba(0, 240, 255, 0.05);
      color: #ffffff;
    }

    /* STYLED DROPDOWN SELECT */
    select.form-input {
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300f0ff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 18px center;
      background-size: 18px;
      cursor: pointer;
      padding-right: 45px;
    }

    select.form-input option {
      background-color: #070e1c;
      color: var(--fluo-cyan);
      font-family: var(--font-cyber);
      font-size: 16px;
      font-weight: 700;
      padding: 12px;
    }

    .flex-row { display: flex; gap: 20px; }
    .flex-1 { flex: 1; }

    /* Number inputs styling */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; margin: 0; 
    }
    input[type=number] { 
      -moz-appearance: textfield; 
      text-align: center; 
      font-size: 20px;
    }

    /* BUTTONS */
    .btn {
      cursor: pointer;
      border-radius: 10px;
      font-weight: 800;
      border: none;
      text-transform: uppercase;
      transition: all 0.25s ease;
      letter-spacing: 1px;
      font-family: var(--font-cyber);
    }

    .btn-primary {
      background: rgba(0, 240, 255, 0.12);
      color: var(--fluo-cyan);
      border: 1px solid var(--fluo-cyan);
      padding: 12px 20px;
      font-size: 13px;
    }
    
    .btn-primary:hover {
      background: var(--fluo-cyan);
      color: #000;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
    }

    .btn-success {
      background: rgba(0, 255, 136, 0.12);
      color: var(--fluo-lime);
      border: 1px solid var(--fluo-lime);
      width: 100%;
      padding: 20px;
      font-size: 18px;
      margin-top: 10px;
    }

    .btn-success:hover {
      background: var(--fluo-lime);
      color: #000;
      box-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
    }

    /* EXERCISE CARDS */
    .exercise-card {
      background: rgba(8, 14, 26, 0.8);
      border: 1px solid rgba(0, 240, 255, 0.15);
      border-left: 5px solid var(--fluo-cyan);
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.4);
    }

    .exercise-card.timebased-mode {
      border-left-color: var(--fluo-magenta);
    }

    .ex-header {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 18px;
    }

    .ex-number {
      font-size: 26px;
      font-weight: 800;
      color: var(--fluo-cyan);
      font-family: var(--font-cyber);
      width: 32px;
      text-align: center;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
    }

    .timebased-mode .ex-number { 
      color: var(--fluo-magenta); 
      text-shadow: 0 0 10px rgba(255, 0, 127, 0.4);
    }

    .ex-actions {
      display: flex;
      gap: 10px;
    }

    .btn-del {
      background: rgba(255, 0, 127, 0.1);
      color: var(--fluo-magenta);
      border: 1px solid var(--fluo-magenta);
      padding: 0 16px;
      font-size: 18px;
    }
    .btn-del:hover { 
      background: var(--fluo-magenta); 
      color: #fff; 
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
    }

    /* METRICS GRID */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 14px;
      background: rgba(0, 0, 0, 0.35);
      padding: 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .metric-box label {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      text-align: center;
      font-family: var(--font-cyber);
      font-weight: 700;
    }

    .reps-wrapper {
      display: flex;
      align-items: stretch;
      gap: 4px;
    }

    .btn-max {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-muted);
      border-radius: 8px;
      padding: 0 10px;
      font-size: 11px;
    }
    
    .btn-max.active {
      background: rgba(255, 0, 127, 0.2);
      border-color: var(--fluo-magenta);
      color: var(--fluo-magenta);
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
    }

    .in-reps.active {
      color: var(--fluo-magenta);
      border-color: var(--fluo-magenta);
      text-shadow: 0 0 8px rgba(255, 0, 127, 0.5);
    }

    .checkbox-wrapper {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-muted);
      font-family: var(--font-cyber);
    }
    
    .checkbox-wrapper input {
      width: 18px; 
      height: 18px;
      accent-color: var(--fluo-lime);
      cursor: pointer;
    }

    .checkbox-wrapper.active { 
      color: var(--fluo-lime); 
      font-weight: bold; 
      text-shadow: 0 0 8px rgba(0, 255, 136, 0.3);
    }

    @media (max-width: 650px) {
      .ex-header { flex-direction: column; align-items: stretch; }
      .ex-number { display: none; }
      .metrics-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- RETURN TO HUB NAVIGATION -->
    <div class="top-bar">
      <a href="index.html" class="back-link">← BACK TO HUB</a>
    </div>

    <div class="header">
      <h1>⚡ CYBERPUMP BUILDER</h1>
      <p>Configure your routine with comfort, download JSON, import to App.</p>
    </div>

    <!-- WORKOUT CONFIG -->
    <div class="card">
      <div class="form-group">
        <label class="form-label">Workout Title</label>
        <input type="text" id="workout-name" class="form-input" value="Custom Workout" placeholder="e.g. Heavy Upper Body">
      </div>
      <div class="form-group">
        <label class="form-label">Description (Optional)</label>
        <input type="text" id="workout-desc" class="form-input" placeholder="Notes, focus area, instructions...">
      </div>

      <div class="form-group" style="border-top: 1px dashed rgba(0,240,255,0.2); padding-top: 22px; margin-top: 25px;">
        <label class="form-label" style="color: var(--fluo-cyan);">Global Execution Mode</label>
        <select id="workout-mode" class="form-input">
          <option value="standard">📋 Standard Mode (Complete all sets of an exercise before moving on)</option>
          <option value="circuit">🔄 Circuit Mode (Run through all exercises sequentially)</option>
        </select>
      </div>

      <div id="circuit-box" class="flex-row" style="display: none; margin-top: 20px;">
        <div class="form-group flex-1">
          <label class="form-label" style="color: var(--fluo-cyan);">Circuit Cycles</label>
          <input type="number" id="circuit-cycles" class="form-input" value="3" min="1">
        </div>
        <div class="form-group flex-1">
          <label class="form-label" style="color: var(--fluo-cyan);">Rest Between Cycles (s)</label>
          <input type="number" id="circuit-rest" class="form-input" value="90" min="0">
        </div>
      </div>
    </div>

    <!-- EXERCISES LIST -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
      <h2 style="font-family: var(--font-cyber); font-size: 22px; color: #fff;">Exercises List</h2>
      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <label class="btn btn-primary" style="cursor: pointer; margin: 0; display: inline-flex; align-items: center;">
          📂 LOAD JSON
          <input type="file" id="file-input-load" accept=".json,.txt" style="display: none;">
        </label>
        <button id="btn-add-ex" class="btn btn-primary">+ Add New Exercise</button>
      </div>
    </div>

    <div id="exercises-container">
      <!-- JS will render exercise cards here -->
    </div>

    <button id="btn-download" class="btn btn-success">💾 DOWNLOAD JSON FOR APP</button>

  </div>

  <script src="builder.js"></script>
</body>
</html>
